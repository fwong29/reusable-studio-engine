<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight — a calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="machine">
    <div class="topbar">
      <div class="nameplate">Weight</div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" title="Tap sound (off)">tap sound: off</button>
    </div>

    <div class="display" id="display">0</div>

    <button class="tally" id="tally">
      <span class="tally-count" id="tallyCount">0</span>
      <div class="tally-marks" id="tallyMarks"></div>
    </button>

    <div class="row">
      <button class="key key--op" data-type="op" data-value="÷">÷</button>
      <button class="key key--op" data-type="op" data-value="×">×</button>
      <button class="key key--op" data-type="op" data-value="−">−</button>
      <button class="key key--op" data-type="op" data-value="+">+</button>
    </div>

    <div class="row">
      <button class="key key--control" data-type="control" data-value="C">C</button>
      <button class="key key--control" data-type="control" data-value="⌫">⌫</button>
      <button class="key key--equals" data-type="control" data-value="=">=</button>
    </div>

    <p class="caption">every number costs as many presses as its own value</p>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
